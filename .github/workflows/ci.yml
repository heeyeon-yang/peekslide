name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - run: node scripts/verify-dist.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-dist.mjs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload site (html/js/css/data/admin)
        run: |
          aws s3 sync dist s3://${{ vars.S3_BUCKET }} \
            --delete --exclude "projects/*" --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Upload slides and fonts
        run: |
          if [ -d dist/projects ]; then
            aws s3 sync dist/projects s3://${{ vars.S3_BUCKET }}/projects --delete --cache-control "public,max-age=3600"
          fi
          if [ -d dist/assets ]; then
            aws s3 sync dist/assets s3://${{ vars.S3_BUCKET }}/assets --delete --cache-control "public,max-age=3600"
          fi

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CF_DIST_ID }} --paths "/*"
